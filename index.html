<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102d32"><link rel="manifest" href="./manifest.json"><link rel="icon" href="./icon192.png"><title>Tideforge — Treasure Tides</title><link rel="stylesheet" href="./style.css"></head>
<body><main>
<header><img src="icon192.png" alt=""><div><h1>TIDEFORGE</h1><span>TREASURE TIDES</span></div><button id="settingsButton" aria-label="Settings">⚙</button></header>
<div id="resourceBar"></div>
<div id="objective"></div>
<section id="islandView" class="view active"><div class="mapbar"><span id="islandLabel">Saltwind Island</span><button id="overdrive">ϟ Boost</button><button id="zoomOut" aria-label="Zoom out">−</button><button id="center">Center</button><button id="zoomIn" aria-label="Zoom in">+</button></div><canvas id="world" aria-label="Island map. Tap to gather, select or build."></canvas><div id="selection"></div><div class="buildbar"><button id="gatherButton">✦ Gather / select</button><button id="buildButton" class="gold">＋ Build</button><button id="rotateButton">↻ East</button></div><p id="buildHint"></p></section>
<section id="contentView" class="view"><div id="content"></div></section>
<section id="adventureView" class="view"><div id="adventureHeader"></div><div id="arena"></div><div id="adventureControls"></div></section>
<nav id="navigation"></nav>
</main>
<div id="toast" role="status"></div>
<dialog id="dialog"><div class="dialoghead"><h2 id="dialogTitle"></h2><button id="closeDialog" aria-label="Close">×</button></div><div id="dialogBody"></div></dialog>
<input id="importFile" type="file" accept=".json,application/json" hidden>
<script src="./model.js"></script><script src="./app.js"></script></body></html>
